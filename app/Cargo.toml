[package]
name = "sso_decision"
version = "0.1.0"
edition = "2024"
description = "SSO as a Decision Model: an AuthZEN-compatible PDP that combines deterministic policy with Jev (TypeSafe System One) signals"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sso_decision"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
